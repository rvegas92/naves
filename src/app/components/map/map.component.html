<google-map
  [height]="'500px'"
  [width]="'100%'"
  [center]="center"
  [zoom]="zoom"
  id="map"
>
<map-marker
*ngFor="let marker of markers"
[position]="marker.position"
[label]="marker.label"
[title]="marker.title"
[icon]="marker.icon"
></map-marker>

<map-polyline 
  *ngFor="let polylineOptions of polylines"
  [options]="polylineOptions">
</map-polyline>

</google-map>
